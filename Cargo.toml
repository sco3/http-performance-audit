[package]
name = "http-performance-audit"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.11.1"
futures = "0.3.31"
http-body-util = "0.1.3"
hyper = "1.8.1"
hyper-util = "0.1.20"
ntex = { version = "3.1.0", features = ["neon-uring", "tokio"] }
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.49.0", features = ["full"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
panic = "abort"
